
<!DOCTYPE html>
<html>
<head>
    <title>Latihan 2</title>
    <style>
        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: lime;
        }

        td {
            background-color: aqua;
        }
    </style>
</head>
<body>

    <h2>Tabel Perkalian 1 sampai 10</h2>

    <table>
        <tr>
            <th>Bilangan</th>

            <script>
                for (let i = 1; i <= 10; i++) {
                    document.write("<th>" + i + "</th>");
                }
            </script>
        </tr>

        <script>
            for (let i = 1; i <= 10; i++) {
                document.write("<tr>");
                document.write("<th>" + i + "</th>");

                for (let j = 1; j <= 10; j++) {
                    document.write("<td>" + (i * j) + "</td>");
                }

                document.write("</tr>");
            }
        </script>
    </table>

</body>
</html>
