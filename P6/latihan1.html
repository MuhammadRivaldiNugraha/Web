<!DOCTYPE html>
<html>
<head>
    <title>Latihan 1</title>
</head>
<body>

    <h2>Bilangan Genap 1 sampai 10</h2>

    <script>
        for (let i = 1; i <= 10; i++) {
            if (i % 2 == 0) {
                document.write(i + "<br>");
            }
        }
    </script>

</body>
</html>
